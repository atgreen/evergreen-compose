name: Bug report
description: Report an Evergreen Compose crash, UI problem, packaging failure, or compatibility issue
title: '[bug] '
labels: []
assignees: []
body:
- type: markdown
  attributes:
    value: Thank you for helping improve Evergreen Compose. Report undisclosed vulnerabilities through
      [private vulnerability reporting](https://github.com/atgreen/evergreen-compose/security/advisories/new),
      or email green@moxielogic.com if the form is unavailable.
- type: textarea
  id: summary
  attributes:
    label: Summary
    description: Describe the problem and its practical impact.
    placeholder: The control displays ..., the app crashes when ..., or APK assembly fails with ...
  validations:
    required: true
- type: input
  id: revision
  attributes:
    label: Evergreen Compose version or revision
    description: Give a release number or the output of `git rev-parse HEAD`.
    placeholder: v0.0.1 or 0123456789abcdef...
  validations:
    required: true
- type: textarea
  id: environment
  attributes:
    label: Environment
    description: Include the host OS and architecture, EGCL and egcl-target-android package versions,
      Compose runtime bundle version, Android version, device ABI, and build method.
    placeholder: Fedora 44 x86-64; EGCL/package versions; Compose bundle version; Android version and
      device; ASDF APK build
  validations:
    required: true
- type: checkboxes
  id: paths
  attributes:
    label: Affected paths
    description: Select every path known to be involved. Leave unknown paths unchecked.
    options:
    - label: Lisp UI tree, callbacks, or state
    - label: Native Compose control or rendering
    - label: Scrolling, gestures, keyboard, or accessibility
    - label: JNI, lifecycle, or permissions
    - label: APK assembly, signing, or runtime bundle
    - label: HTTP, feeds, saved state, or platform services
    - label: Sample application
- type: textarea
  id: reproducer
  attributes:
    label: Minimal reproducer
    description: Provide the smallest Lisp app, exact build command, and device interaction steps that
      reproduce the problem.
    render: shell
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual behavior
    description: Include the exit status and complete error or backtrace when available.
  validations:
    required: true
- type: dropdown
  id: validation_scope
  attributes:
    label: Where was the problem reproduced?
    description: Host checks cannot establish JNI or device rendering behavior. Identify the environment
      you actually tested.
    options:
    - Host only
    - Physical Android device
    - Android emulator
    - Host and Android
    - Not yet isolated
  validations:
    required: true
- type: textarea
  id: logs
  attributes:
    label: Additional evidence
    description: Add relevant logs, a backtrace, screenshots, or a reduced example. Remove signing keys,
      tokens, private messages, and other personal data.
- type: checkboxes
  id: checks
  attributes:
    label: Checklist
    options:
    - label: I searched existing issues for this problem.
      required: true
    - label: This report does not disclose a security vulnerability or private data.
      required: true
