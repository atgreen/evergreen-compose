name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Same-commit workflow; keep syntax supported by actionlint 1.7.12.
    uses: ./.github/workflows/validate.yml # zizmor: ignore[self-repository]
